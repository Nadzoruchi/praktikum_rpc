syntax = "proto3";
package akademik;

service LayananNilai {
  rpc GetMahasiswa (MahasiswaRequest) returns (Mahasiswa);
  rpc TambahNilai (NilaiRequest) returns (StatusResponse);
  rpc StreamNilai (MahasiswaRequest) returns (stream Nilai);
  rpc KirimBanyakNilai (stream NilaiRequest) returns (StatusResponse);
  rpc Diskusi (stream Pesan) returns (stream Pesan);
  rpc Transfer (TransferRequest) returns (StatusResponse);
  rpc GetSaldo (Empty) returns (SaldoResponse);
}

message MahasiswaRequest { string nim = 1; }
message Mahasiswa { string nim = 1; string nama = 2; double ipk = 3; string prodi = 4; }
message NilaiRequest { string nim = 1; string matkul = 2; double nilai = 3; }
message Nilai { string matkul = 1; double nilai = 2; }
message StatusResponse { bool sukses = 1; string pesan = 2; }
message Pesan { string pengirim = 1; string isi = 2; string ruang = 3; }
message TransferRequest { string request_id = 1; string dari = 2; string ke = 3; double jumlah = 4; }
message Empty {}
message SaldoResponse { double saldo_a = 1; double saldo_b = 2; double total = 3; }
